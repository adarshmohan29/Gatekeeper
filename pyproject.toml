[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatekeeper"
version = "0.1.0"
description = "Real-time DDoS detection and automated mitigation platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "confluent-kafka>=2.4",
    "redis>=5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
# Training only (host): the services serve exported ONNX models and don't need these.
ml = ["xgboost>=2", "onnxmltools>=1.12", "torch>=2.6", "onnxscript>=0.2", "pyarrow>=15"]
dev = [
    "gatekeeper[ml]",
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-cov>=5",
    "fakeredis>=2.23",
]

[tool.setuptools.packages.find]
include = ["shared*", "services*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "ARG", "ERA", "RET", "PIE", "PL"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic numbers are fine in assertions

[tool.coverage.run]
source = ["shared", "services", "ml"]
# I/O entrypoints are kept thin and exercised by the gate tests instead.
omit = ["services/*/main.py", "services/loadgen/*"]
branch = true

[tool.coverage.report]
fail_under = 100
skip_empty = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["shared", "services", "ml", "scripts", "tests"]
exclude = ["services/loadgen/"]
platform = "linux"  # services run in Linux containers (AF_PACKET)

[[tool.mypy.overrides]]  # no type information shipped
module = ["onnxmltools.*", "onnxruntime.*", "pyarrow.*", "xgboost.*"]
ignore_missing_imports = true
