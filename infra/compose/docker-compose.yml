name: gatekeeper

# `lab` is internal: no route to the outside world. Only Redpanda also joins
# `default` so the host can reach it on 127.0.0.1:19092. Dynamic addresses come
# from the lower half of the subnet; the upper half is for fixed addresses.
networks:
  lab:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.0/25
  default:

x-python-service: &python-service
  build:
    context: ../..
    dockerfile: services/Dockerfile
  environment:
    KAFKA_BOOTSTRAP: redpanda:9092
    REDIS_URL: redis://redis:6379/0
    MODELS_DIR: /app/models
    DETECTOR: ${DETECTOR:-threshold}  # threshold | xgboost | autoencoder
    POSTGRES_DSN: postgresql://gatekeeper:gatekeeper@postgres/gatekeeper
    ENFORCER_URL: http://victim:9000
    ENFORCER_TOKEN: ${ENFORCER_TOKEN:-local-dev-token}  # set a real one outside the lab
    ALLOWLIST: 172.30.0.201/32  # a known-good load tester: may be flagged, never blocked
    RULE_TTL_S: 15  # short so gates and demos see rules expire
  restart: unless-stopped

services:
  redpanda:
    image: redpandadata/redpanda:v25.1.9
    command: >-
      redpanda start --mode dev-container --smp 1 --memory 512M
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://redpanda:9092,external://127.0.0.1:19092
    ports: ["127.0.0.1:19092:19092"]
    networks: [lab, default]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      retries: 20

  # Turns on consumer-group lag metrics and creates topics (each with a dead-letter topic) before
  # anything uses them. 6 partitions = room for up to 6 consumer replicas. `describe` makes a
  # rerun succeed when the topics already exist.
  redpanda-init:
    image: redpandadata/redpanda:v25.1.9
    environment:
      TOPICS: flow-events features scores flow-events-dlq features-dlq scores-dlq
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        rpk() { command rpk "$$@" -X brokers=redpanda:9092 -X admin.hosts=redpanda:9644; }
        rpk cluster config set enable_consumer_group_metrics '["group", "partition", "consumer_lag"]'
        rpk topic create $$TOPICS -p 6 || rpk topic describe $$TOPICS
    networks: [lab]
    depends_on:
      redpanda: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    networks: [lab]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: gatekeeper
      POSTGRES_DB: gatekeeper
    volumes: ["./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    networks: [lab]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gatekeeper"]
      interval: 3s

  victim:
    image: nginx:1.27-alpine
    networks: [lab]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 3s

  collector:
    <<: *python-service
    command: python -m services.collector.main
    network_mode: service:victim
    cap_add: [NET_RAW]
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
      victim: { condition: service_healthy }

  feature-engine:
    <<: *python-service
    command: python -m services.feature_engine.main
    networks: [lab]
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  detector:
    <<: *python-service
    command: uvicorn services.detector.main:app --host 0.0.0.0 --port 8000
    networks: [lab]
    volumes: ["../../models:/app/models:ro"]
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 3s

  # Applies rules with nftables inside the victim's network namespace.
  enforcer:
    <<: *python-service
    command: uvicorn services.enforcer.main:app --host 0.0.0.0 --port 9000
    network_mode: service:victim
    cap_add: [NET_ADMIN]
    depends_on:
      victim: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9000/healthz')"]
      interval: 3s

  mitigation:
    <<: *python-service
    command: python -m services.mitigation.main
    networks: [lab]
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      enforcer: { condition: service_healthy }

  drift:
    <<: *python-service
    command: python -m services.drift.main
    volumes: ["../../models:/app/models:ro"]
    networks: [lab]
    depends_on:
      redpanda-init: { condition: service_completed_successfully }

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    networks: [lab, default]

  grafana:
    image: grafana/grafana:12.1.0
    environment:  # local lab only: no login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/gatekeeper.yml:ro
      - ../monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/gatekeeper.yml:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    networks: [lab, default]
    depends_on: [prometheus]

  # Three replicas = three normal source IPs.
  loadgen:
    image: locustio/locust:2.32.0
    command: -f /mnt/locustfile.py --headless -u 10 -r 2 --host http://victim
    volumes: ["../../services/loadgen/locustfile.py:/mnt/locustfile.py:ro"]
    networks: [lab]
    deploy: { replicas: 3 }
    depends_on:
      victim: { condition: service_healthy }

  # On demand only: `docker compose run --rm attacker syn 20`.
  attacker:
    build: ../../services/attacker
    profiles: [attack]
    cap_add: [NET_RAW]
    networks:
      lab: { ipv4_address: 172.30.0.200 }
