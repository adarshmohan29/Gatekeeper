name: gatekeeper

# `lab` is internal: no route to the outside world. Only Redpanda also joins
# `default` so the host can reach it on 127.0.0.1:19092. Dynamic addresses come
# from the lower half of the subnet; the upper half is for fixed addresses.
networks:
  lab:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.0/25
  default:

x-python-service: &python-service
  build:
    context: ../..
    dockerfile: services/Dockerfile
  environment:
    KAFKA_BOOTSTRAP: redpanda:9092
    REDIS_URL: redis://redis:6379/0
    BASELINE_PATH: /app/models/baseline.json
    POSTGRES_DSN: postgresql://gatekeeper:gatekeeper@postgres/gatekeeper
    ENFORCER_URL: http://victim:9000
    ENFORCER_TOKEN: ${ENFORCER_TOKEN:-local-dev-token}  # set a real one outside the lab
    ALLOWLIST: 172.30.0.201/32  # a known-good load tester: may be flagged, never blocked
    RULE_TTL_S: 15  # short so gates and demos see rules expire
  restart: unless-stopped

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command: >-
      redpanda start --mode dev-container --smp 1 --memory 512M
      --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      --advertise-kafka-addr internal://redpanda:9092,external://127.0.0.1:19092
    ports: ["127.0.0.1:19092:19092"]
    networks: [lab, default]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      retries: 20

  # Creates topics before anything uses them. 6 partitions = room for up to 6 consumer replicas.
  # `describe` makes a rerun succeed when the topics already exist.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    entrypoint: ["sh", "-c"]
    command: >-
      "rpk topic create flow-events features scores -p 6 -X brokers=redpanda:9092
      || rpk topic describe flow-events features scores -X brokers=redpanda:9092"
    networks: [lab]
    depends_on:
      redpanda: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    networks: [lab]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: gatekeeper
      POSTGRES_DB: gatekeeper
    volumes: ["./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    networks: [lab]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gatekeeper"]
      interval: 3s

  victim:
    image: nginx:1.27-alpine
    networks: [lab]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 3s

  collector:
    <<: *python-service
    command: python -m services.collector.main
    network_mode: service:victim
    cap_add: [NET_RAW]
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
      victim: { condition: service_healthy }

  feature-engine:
    <<: *python-service
    command: python -m services.feature_engine.main
    networks: [lab]
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  detector:
    <<: *python-service
    command: uvicorn services.detector.main:app --host 0.0.0.0 --port 8000
    networks: [lab]
    volumes: ["../../models:/app/models:ro"]
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 3s

  # Applies rules with nftables inside the victim's network namespace.
  enforcer:
    <<: *python-service
    command: uvicorn services.enforcer.main:app --host 0.0.0.0 --port 9000
    network_mode: service:victim
    cap_add: [NET_ADMIN]
    depends_on:
      victim: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9000/healthz')"]
      interval: 3s

  mitigation:
    <<: *python-service
    command: python -m services.mitigation.main
    networks: [lab]
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      enforcer: { condition: service_healthy }

  # Three replicas = three normal source IPs.
  loadgen:
    image: locustio/locust:2.32.0
    command: -f /mnt/locustfile.py --headless -u 10 -r 2 --host http://victim
    volumes: ["../../services/loadgen/locustfile.py:/mnt/locustfile.py:ro"]
    networks: [lab]
    deploy: { replicas: 3 }
    depends_on:
      victim: { condition: service_healthy }

  # On demand only: `docker compose run --rm attacker syn 20`.
  attacker:
    build: ../../services/attacker
    profiles: [attack]
    cap_add: [NET_RAW]
    networks:
      lab: { ipv4_address: 172.30.0.200 }
