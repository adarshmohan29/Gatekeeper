global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: gatekeeper
    static_configs:
      - { targets: ["victim:9100"], labels: { service: collector } }  # runs in the victim's netns
      - { targets: ["feature-engine:9100"], labels: { service: feature-engine } }
      - { targets: ["detector:9100"], labels: { service: detector } }
      - { targets: ["mitigation:9100"], labels: { service: mitigation } }
      - { targets: ["drift:9100"], labels: { service: drift } }
  - job_name: redpanda  # consumer-group lag comes from the broker, so it shows even if a consumer dies
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
