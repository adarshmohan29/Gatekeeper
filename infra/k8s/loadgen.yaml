# Normal traffic: three Locust replicas = three normal source IPs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
spec:
  replicas: 3
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      containers:
        - name: locust
          image: locustio/locust:2.32.0
          args: [-f, /mnt/locustfile.py, --headless, -u, "10", -r, "2", --host, http://victim]
          volumeMounts:
            - { name: locustfile, mountPath: /mnt }
      volumes:
        - name: locustfile
          configMap: { name: locustfile }
